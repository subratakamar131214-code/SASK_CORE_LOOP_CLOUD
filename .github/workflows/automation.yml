name: Scheduled Modular Python Automation & Validation Pipeline

on:
  schedule:
    # Trigger execution every 6 hours automatically
    - cron: '0 */6 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    name: Execute Automation & Validation Cycles
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python Environment
        run: |
          python --version
          python -c "import sys; print('Platform:', sys.platform); print('Prefix:', sys.prefix)"

      - name: Step 1 - Syntax Validation (Prover)
        run: |
          python -m py_compile core.py drives.py bio_gen.py telos.py mutate.py prover.py verify.py science_mcp.py

      - name: Step 2 - Ancestral Verification Gate
        run: |
          set -o pipefail
          python verify.py 2>&1 | tee verify_output.log

      - name: Publish Verification Diagnostics
        if: always()
        run: |
          if [ -f verify_output.log ]; then
            {
              echo "### Ancestral Verification Output"
              echo '```'
              tail -n 150 verify_output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Step 3 - Execute Automation Kernel Cycle
        run: |
          python core.py --cycles 1 --export-state execution_state.json

      - name: Step 4 - Archive Execution State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-state-telemetry
          path: |
            execution_state.json
            .sask_ego_ratchet.json
          if-no-files-found: ignore
