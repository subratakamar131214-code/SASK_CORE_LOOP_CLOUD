name: Immortal Relay Execution Pipeline

on:
  schedule:
    # Scheduled 6-hour cron trigger (standard 5-field cron syntax)
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Wall-clock execution window in minutes'
        required: false
        default: '340'
        type: string
      enable_successor:
        description: 'Whether to trigger successor runner instance via REST API'
        required: false
        default: true
        type: boolean
      stream_level:
        description: 'Exhaustive goal expansion level (0=primary, 1=5, 2=15, 3=75 permutations)'
        required: false
        default: '2'
        type: string
      stream_concurrency:
        description: 'Maximum streamed goals in flight (worker slots)'
        required: false
        default: '4'
        type: string

concurrency:
  group: immortal-relay
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  relay-execution:
    name: Relay Execution & Handoff
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SASK_STREAM_ENABLED: "1"
      SASK_STREAM_LEVEL: ${{ inputs.stream_level || '2' }}
      SASK_MAX_CONCURRENCY: ${{ inputs.stream_concurrency || '4' }}
      SASK_EXTENSIONS_ENABLED: "1"
      SASK_CURIOSITY_INTERVAL: "180"

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Lean 4 via elan
        run: |
          echo "Installing elan toolchain manager..."
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Environment & Toolchains
        run: |
          python --version
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version || echo "elan installed"
          lean --version || echo "lean toolchain active"

      - name: Pre-Flight Syntax & Import Gate
        run: |
          python -m py_compile core.py drives.py bio_gen.py telos.py mutate.py prover.py verify.py science_mcp.py \
            meta_prover.py telos_v2.py manifold_bridge.py devil_advocate.py
          python -c "import core, drives, bio_gen, telos, mutate, prover, verify, science_mcp, meta_prover, telos_v2, manifold_bridge, devil_advocate; print('SASK KERNEL + 10 ROUTERS + 4 EXTENSIONS FULLY INTEGRATED')"

      - name: Execute Core Event Loop
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          WINDOW_MINS="${{ inputs.window_minutes || '340' }}"
          python core.py --continuous --window-minutes "$WINDOW_MINS" \
            --stream-level "${SASK_STREAM_LEVEL:-2}" \
            --stream-concurrency "${SASK_MAX_CONCURRENCY:-4}" \
            --export-state execution_state.json

      - name: Commit Modified Code Changes
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "relay: update execution state & synthesized artifacts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No repository modifications detected; skipping commit."
          fi

      - name: Upload Execution Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-execution-state
          path: |
            execution_state.json
            .sask_ego_ratchet.json
            .sask_goal_ledger.json
            .sask_goal_stream.json
            .sask_meta_prover.json
            .sask_curiosity.json
            .sask_manifold.json
            .sask_devil_advocate.json
            goals_manifest.json
          if-no-files-found: ignore

      - name: Trigger Successor Runner via GitHub REST API
        if: ${{ always() && github.event.inputs.enable_successor != 'false' }}
        run: |
          echo "Invoking GitHub REST API dispatch for successor runner..."
          # Note: Standard GITHUB_TOKEN forbids recursive self-dispatch to prevent accidental billing runaway;
          # a Personal Access Token (RELAY_PAT) is used if configured.
          AUTH_TOKEN="${{ secrets.RELAY_PAT || secrets.GITHUB_TOKEN }}"
          TARGET_REF="${{ github.ref_name }}"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/immortal_relay.yml/dispatches" \
            -d "{\"ref\":\"$TARGET_REF\"}")
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          echo "Dispatch response status code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successor runner successfully scheduled."
          else
            echo "Notice: Successor dispatch returned HTTP $STATUS. In scheduled/cron runs without a PAT, successor chaining is handled by the 6-hour cron schedule."
          fi
